  <text x="230" y="620" fill="#f0cf9e" font-family="Inter, Arial, sans-serif" font-size="24">Operational Doctrine</text>
  <text x="230" y="660" fill="#e2bc8a" font-family="Inter, Arial, sans-serif" font-size="22">No release without deterministic repro of high-severity incidents.</text>
  <text x="230" y="694" fill="#e2bc8a" font-family="Inter, Arial, sans-serif" font-size="22">No trust claims without observable route reasons and failure codes.</text>

