<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ZeeMe Memory Systems Dossier Cover</title>
  <desc id="desc">Warm neoclassical cover art for ZeeMe memory continuity research dossier.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A1416"/>
      <stop offset="55%" stop-color="#1E1114"/>
      <stop offset="100%" stop-color="#140B0E"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#E8BC77" stop-opacity="0.42"/>
      <stop offset="48%" stop-color="#D59A57" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#D59A57" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D7A96A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D7A96A" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#D7A96A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="60" y="60" width="1480" height="780" rx="38" fill="none" stroke="#C8985F" stroke-opacity="0.28" stroke-width="2"/>
  <ellipse cx="800" cy="450" rx="650" ry="340" fill="url(#halo)"/>

  <text x="800" y="200" text-anchor="middle" fill="#E6C79A" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="9">ZEEME RESEARCH DOSSIER IV</text>

  <text x="800" y="360" text-anchor="middle" fill="#F9E4C5" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700">Memory Continuity</text>
  <text x="800" y="440" text-anchor="middle" fill="#F9E4C5" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700">Architecture</text>

  <line x1="430" y1="510" x2="1170" y2="510" stroke="url(#line)" stroke-width="2"/>

  <text x="800" y="585" text-anchor="middle" fill="#E3C08B" font-family="'DM Sans', Arial, sans-serif" font-size="30" letter-spacing="2">one lane • one memory graph • one continuity model</text>

  <g fill="none" stroke="#D7A96A" stroke-opacity="0.55">
    <circle cx="445" cy="652" r="78"/>
    <circle cx="445" cy="652" r="54"/>
    <circle cx="445" cy="652" r="30"/>
    <circle cx="1155" cy="652" r="78"/>
    <circle cx="1155" cy="652" r="54"/>
    <circle cx="1155" cy="652" r="30"/>
  </g>

  <text x="445" y="660" text-anchor="middle" fill="#E6C79A" font-family="'DM Sans', Arial, sans-serif" font-size="26">TEXT</text>
  <text x="1155" y="660" text-anchor="middle" fill="#E6C79A" font-family="'DM Sans', Arial, sans-serif" font-size="26">VOICE</text>

  <line x1="523" y1="652" x2="1077" y2="652" stroke="#D7A96A" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="800" y="835" text-anchor="middle" fill="#CFA472" font-family="'DM Sans', Arial, sans-serif" font-size="22" letter-spacing="3">FEBRUARY 2026 • ENGINEERING ARCHIVE</text>
</svg>
