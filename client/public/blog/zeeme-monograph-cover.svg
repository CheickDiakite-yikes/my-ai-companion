  <text x="230" y="523" fill="#e7c89a" font-family="Inter, Arial, sans-serif" font-size="24">Companion trust is an engineering reliability property.</text>
  <text x="230" y="560" fill="#e7c89a" font-family="Inter, Arial, sans-serif" font-size="24">One ledger, one time anchor, one safety boundary.</text>
  <text x="230" y="597" fill="#e7c89a" font-family="Inter, Arial, sans-serif" font-size="24">No continuity without deterministic context hygiene.</text>

