<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#150f10"/>
      <stop offset="48%" stop-color="#271718"/>
      <stop offset="100%" stop-color="#120d0e"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#e9bd76" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e9bd76" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b2924"/>
      <stop offset="100%" stop-color="#241917"/>
